<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      :root {
        --ink: #111215;
        --guide-main: #b8c0c9;
        --guide-sub: #dce1e6;
        --guide-accent: #e65c00;
      }
      body.theme-dark :root, :root.theme-dark {
        --ink: #f0f2f5;
        --guide-main: #4a5460;
        --guide-sub: #2d343e;
        --guide-accent: #ff772e;
      }
      
      /* DRAWING ANIMATIONS */
      .anim-axis {
        stroke: var(--guide-main);
        stroke-width: 1.4;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .anim-subguide {
        stroke: var(--guide-sub);
        stroke-width: 1.1;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }
      .anim-circle-guide {
        fill: none;
        stroke: var(--guide-sub);
        stroke-width: 1.2;
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: drawLine 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      }
      .anim-ink {
        fill: none;
        stroke: var(--ink);
        stroke-width: 15;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: drawLine 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      }
      .anim-text {
        font-family: 'Montserrat', 'Century Gothic', -apple-system, sans-serif;
        font-size: 88px;
        font-weight: 500;
        letter-spacing: 0.32em;
        fill: var(--ink);
        text-anchor: middle;
        opacity: 0;
        animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      }
      
      /* Interactive hover */
      svg:hover .anim-circle-guide {
        stroke: var(--guide-accent);
        transition: stroke 0.4s ease;
      }
      svg:hover .compass-wheel {
        transform-origin: 680px 316px;
        animation: spinCompass 10s linear infinite;
      }
      
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes spinCompass {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- ARCHITECTURAL CONSTRUCTION GUIDES -->
  <g id="drafting-guides">
    <!-- Horizontal Equator Axis: spans 120 to 904 -->
    <line x1="120" y1="316" x2="904" y2="316" class="anim-axis" />

    <!-- Vertical Centerline Left Circle C1 (x=360) -->
    <line x1="360" y1="90" x2="360" y2="542" class="anim-axis" />

    <!-- Vertical Centerline Right Shape C2 (x=680) -->
    <line x1="680" y1="80" x2="680" y2="552" class="anim-axis" />

    <!-- Top Tangent Guide (y=156) -->
    <line x1="530" y1="156" x2="880" y2="156" class="anim-subguide" />
    
    <!-- Diagonal Ray 1: C1 center (360, 316) to C2 apex (680, 156) -->
    <line x1="360" y1="316" x2="680" y2="156" class="anim-subguide" />

    <!-- Diagonal Ray 2: C1 center (360, 316) to C2 bottom (680, 476) -->
    <line x1="360" y1="316" x2="680" y2="476" class="anim-subguide" />

    <!-- 45-degree Ray through C2 -->
    <line x1="520" y1="476" x2="840" y2="156" class="anim-subguide" />

    <!-- Compass Construction Circle (full C2 ring, r=160) -->
    <g class="compass-wheel">
      <circle cx="680" cy="316" r="160" class="anim-circle-guide" />
      <circle cx="680" cy="316" r="80" class="anim-circle-guide" />
      <!-- Inscribed circle at tangency (520, 316) -->
      <circle cx="520" cy="316" r="48" class="anim-circle-guide" />
    </g>
  </g>

  <!-- SOLID INK GLYPHS: OE (UNDISTORTED MATHEMATICAL PERFECTION) -->
  <g id="ink-glyphs">
    <!-- LEFT GLYPH: 'O' -->
    <!-- Full Circle: center=(360, 316), radius=160 -->
    <circle cx="360" cy="316" r="160" class="anim-ink" />
    <!-- Horizontal Crossbar of 'O': from (200, 316) to (520, 316) -->
    <line x1="200" y1="316" x2="520" y2="316" class="anim-ink" style="animation-delay: 0.8s" />

    <!-- RIGHT GLYPH: 'E' -->
    <!-- Vertical Chord from top (680, 156) to bottom (680, 476) -->
    <line x1="680" y1="156" x2="680" y2="476" class="anim-ink" style="animation-delay: 0.9s" />

    <!-- Top-Right Arc: Quarter circle from (680, 156) to (840, 316) -->
    <path d="M 680,156 A 160 160 0 0 1 840,316" class="anim-ink" style="animation-delay: 1.0s" />

    <!-- Mid Horizontal Bar: from (680, 316) to (840, 316) -->
    <line x1="680" y1="316" x2="840" y2="316" class="anim-ink" style="animation-delay: 1.1s" />

    <!-- Bottom-Left Arc: Quarter circle from (520, 316) to (680, 476) -->
    <path d="M 520,316 A 160 160 0 0 0 680,476" class="anim-ink" style="animation-delay: 1.2s" />
  </g>

  <!-- TYPOGRAPHY: VISUAL (EXACT GEOMETRIC ALIGNMENT) -->
  <text x="532" y="635" class="anim-text">VISUAL</text>
</svg>